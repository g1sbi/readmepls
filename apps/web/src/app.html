<!doctype html>
<html lang="en">
  <head>
    <!-- Privacy-friendly analytics by Plausible -->
    <script
      async
      src="https://analytics.gisbi.me/js/pa-mho_h2uy9LnnaV-9Cp9Vf.js"
    ></script>
    <script>
      ((window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        }),
        (plausible.init =
          plausible.init ||
          function (i) {
            plausible.o = i || {};
          }));
      plausible.init();
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- preload the two faces above the fold: Ronzino regular + medium -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/ronzino-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/ronzino-medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Theme before first paint (mirrors lib/theme/theme.ts); never throws. -->
    <script data-theme-boot>
      (function () {
        var mode = "light";
        try {
          var ls = localStorage;
          if (ls.getItem("theme-v") !== "2") {
            if (ls.getItem("theme") !== "dark") ls.removeItem("theme");
            ls.setItem("theme-v", "2");
          }
          var pref = ls.getItem("theme");
          if (pref === "light" || pref === "dark") mode = pref;
          else
            mode = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        } catch (e) {}
        document.documentElement.dataset.theme = mode;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
